<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learna AI - Học Tiếng Anh Cùng AI</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel compiler cho React JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div id="root"></div>

  <!-- Dán mã React (.jsx) của anh vào trong thẻ script này -->
  <script type="text/babel">
   import React, { useState, useEffect, useRef } from 'react';
import {
  Mic, MicOff, Volume2, Sparkles, Flame, Trophy, Award, Settings,
  BookOpen, MessageSquare, Play, RefreshCw, Send, CheckCircle2,
  AlertCircle, ChevronRight, Compass, Home, User, Lightbulb,
  ArrowRight, Globe, Headphones, BarChart2, Check, HelpCircle
} from 'lucide-react';

const SCENARIOS = [
  {
    id: 'coffee',
    title: 'Gọi Cà Phê (Ordering Coffee)',
    category: 'Đời Sống Daily',
    icon: '☕',
    level: 'Cơ Bản (A1-A2)',
    description: 'Thực hành đặt đồ uống và thanh toán tại quán Starbucks.',
    systemPrompt: 'You are a barista at a cozy coffee shop in New York. Speak short, simple, polite English (1-2 sentences). Help the user order coffee.',
    firstMessage: "Hi there! Welcome to Central Perk Coffee. What can I get started for you today?"
  },
  {
    id: 'interview',
    title: 'Phỏng Vấn Xin Việc (Job Interview)',
    category: 'Công Việc',
    icon: '💼',
    level: 'Trung Cấp (B1-B2)',
    description: 'Trả lời các câu hỏi phỏng vấn vị trí Software Developer / Marketing.',
    systemPrompt: 'You are an HR Manager interviewing the user for a professional role. Ask realistic, standard job interview questions in clear professional English.',
    firstMessage: "Welcome! Thank you for coming in today. To start off, could you tell me a little bit about yourself?"
  },
  {
    id: 'taxi',
    title: 'Bắt Xe Taxi (Taxi Ride)',
    category: 'Du Lịch',
    icon: '🚖',
    level: 'Cơ Bản (A1-A2)',
    description: 'Hướng dẫn tài xế đi đúng địa điểm và hỏi giá tiền.',
    systemPrompt: 'You are a friendly taxi driver in London. Ask where the user wants to go and discuss route or fare in short English sentences.',
    firstMessage: "Hello mate! Where are we heading to today?"
  },
  {
    id: 'airport',
    title: 'Làm Thủ Tục Sân Bay (Airport Check-in)',
    category: 'Du Lịch',
    icon: '✈️',
    level: 'Sơ Cấp (A2)',
    description: 'Check-in vé máy bay, cân hành lý và nhận thẻ lên máy bay.',
    systemPrompt: 'You are an airline check-in agent at JFK airport. Guide the passenger through passport check and luggage drop.',
    firstMessage: "Good morning! Can I please see your passport and flight booking confirmation?"
  },
  {
    id: 'freetalk',
    title: 'Trò Chuyện Tự Do (Free Talk)',
    category: 'Giao Tiếp',
    icon: '💬',
    level: 'Mọi Cấp Độ',
    description: 'Thảo luận sở thích, phim ảnh, văn hóa hoặc bất kỳ chủ đề nào bạn thích.',
    systemPrompt: 'You are a friendly English tutor named Learna AI. Have a natural conversation, keeping language clear and encouraging.',
    firstMessage: "Hello! I'm Learna, your AI English tutor. How is your day going so far? Tell me anything!"
  }
];

const SUGGESTED_PHRASES = [
  "Can I get an Iced Latte with oat milk, please?",
  "How much does this cost?",
  "Could you repeat that more slowly, please?",
  "I have 3 years of experience in marketing."
];

export default function App() {
  const [activeTab, setActiveTab] = useState('scenarios'); // scenarios, practice, stats, settings
  const [selectedScenario, setSelectedScenario] = useState(SCENARIOS[0]);
  const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
  const [showSettings, setShowSettings] = useState(false);
  
  // Stats & Gamification
  const [streak, setStreak] = useState(5);
  const [xp, setXp] = useState(340);
  const [accuracyScore, setAccuracyScore] = useState(88);
  const [completedSessions, setCompletedSessions] = useState(12);

  // Chat & Interaction State
  const [messages, setMessages] = useState([]);
  const [inputText, setInputText] = useState('');
  const [isRecording, setIsRecording] = useState(false);
  const [isLoading, setIsLoading] = useState(false);
  const [playingAudioIndex, setPlayingAudioIndex] = useState(null);
  const [currentFeedback, setCurrentFeedback] = useState(null);

  // Speech Recognition setup
  const recognitionRef = useRef(null);

  useEffect(() => {
    // Reset conversation on scenario change
    setMessages([
      {
        sender: 'ai',
        text: selectedScenario.firstMessage,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        translation: 'Xin chào! Chào mừng đến với quán. Tôi có thể lấy gì cho bạn hôm nay?'
      }
    ]);
    setCurrentFeedback(null);
  }, [selectedScenario]);

  // Speech Recognition Initialization
  useEffect(() => {
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognitionRef.current = new SpeechRecognition();
      recognitionRef.current.continuous = false;
      recognitionRef.current.interimResults = false;
      recognitionRef.current.lang = 'en-US';

      recognitionRef.current.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        setInputText(transcript);
        setIsRecording(false);
      };

      recognitionRef.current.onerror = (event) => {
        console.error("Speech recognition error", event.error);
        setIsRecording(false);
      };

      recognitionRef.current.onend = () => {
        setIsRecording(false);
      };
    }
  }, []);

  const toggleRecording = () => {
    if (!recognitionRef.current) {
      alert("Trình duyệt của bạn không hỗ trợ Micro thu âm trực tiếp. Hãy nhập bằng văn bản!");
      return;
    }

    if (isRecording) {
      recognitionRef.current.stop();
      setIsRecording(false);
    } else {
      try {
        recognitionRef.current.start();
        setIsRecording(true);
      } catch (e) {
        console.error(e);
      }
    }
  };

  const saveApiKey = (key) => {
    setApiKey(key);
    localStorage.setItem('gemini_api_key', key);
    setShowSettings(false);
  };

  const handleSendMessage = async (textToSend) => {
    const queryText = textToSend || inputText;
    if (!queryText.trim()) return;

    const userTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const userMsg = { sender: 'user', text: queryText, time: userTime };
    
    setMessages(prev => [...prev, userMsg]);
    setInputText('');
    setIsLoading(true);

    try {
      // Build Prompt asking Gemini to respond in English AND provide Vietnamese structured feedback
      const systemInstruction = `You are an AI English Tutor inspired by Learna AI, chatting with a Vietnamese native speaker learning English.
Current Scenario: ${selectedScenario.title}. Context: ${selectedScenario.systemPrompt}.

You must return a raw JSON object with this exact structure:
{
  "replyEnglish": "Your short natural English response (1-3 sentences maximum)",
  "replyVietnamese": "Trần thuật ngắn gọn tiếng Việt của replyEnglish",
  "feedback": {
    "grammarCheck": "Đánh giá ngữ pháp câu nói người dùng bằng tiếng Việt (khen nếu đúng, sửa lỗi nhỏ nếu có)",
    "pronunciationTip": "Lời khuyên phát âm bằng tiếng Việt cho từ nổi bật trong câu nói người dùng",
    "suggestedBetterWay": "Cách diễn đạt tự nhiên hơn bằng tiếng Anh nếu có (ngắn gọn)"
  }
}
Do not wrap in markdown tags if possible, output pure JSON.`;

      const activeApiKey = apiKey.trim() || '';
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${activeApiKey}`;

      const conversationHistory = messages.map(m => `${m.sender === 'user' ? 'Student' : 'Tutor'}: ${m.text}`).join('\n');
      const fullPrompt = `History:\n${conversationHistory}\nStudent just said: "${queryText}"\nProvide response and feedback now.`;

      const response = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: fullPrompt }] }],
          systemInstruction: { parts: [{ text: systemInstruction }] },
          generationConfig: { responseMimeType: "application/json" }
        })
      });

      const data = await response.json();
      const rawJsonStr = data?.candidates?.[0]?.content?.parts?.[0]?.text;

      let resultParsed = null;
      try {
        resultParsed = JSON.parse(rawJsonStr);
      } catch (e) {
        resultParsed = {
          replyEnglish: "Great attempt! Keep practicing your English phrasing.",
          replyVietnamese: "Nỗ lực rất tốt! Hãy tiếp tục luyện tập câu từ tiếng Anh của bạn.",
          feedback: {
            grammarCheck: "Cấu trúc câu của bạn khá tốt và rõ nghĩa.",
            pronunciationTip: "Hãy chú ý nhấn trọng âm rõ ràng hơn ở các danh từ chính.",
            suggestedBetterWay: queryText
          }
        };
      }

      const aiMsg = {
        sender: 'ai',
        text: resultParsed.replyEnglish,
        translation: resultParsed.replyVietnamese,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      setMessages(prev => [...prev, aiMsg]);
      setCurrentFeedback(resultParsed.feedback);

      // Play Audio TTS for English response
      speakText(resultParsed.replyEnglish);

      // Reward XP
      setXp(prev => prev + 15);

    } catch (err) {
      console.error(err);
      // Fallback response if key is missing or call fails
      const fallbackMsg = {
        sender: 'ai',
        text: "I understood you! That sounds like a great idea. Would you like to tell me more?",
        translation: "Tôi đã hiểu bạn! Nghe có vẻ là một ý tưởng tuyệt vời. Bạn có muốn kể thêm không?",
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };
      setMessages(prev => [...prev, fallbackMsg]);
      setCurrentFeedback({
        grammarCheck: "Câu nói chuẩn ngữ pháp! (Gợi ý: Nhập API Key trong Cài Đặt để dùng phản hồi AI nâng cao)",
        pronunciationTip: "Phát âm rõ ràng khẩu hình môi khi phát âm đuôi /s/ và /t/.",
        suggestedBetterWay: queryText
      });
      speakText(fallbackMsg.text);
    } finally {
      setIsLoading(false);
    }
  };

  const speakText = (text, index = null) => {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel(); // Stop current speech
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9; // Friendly learning speed

      if (index !== null) setPlayingAudioIndex(index);

      utterance.onend = () => setPlayingAudioIndex(null);
      utterance.onerror = () => setPlayingAudioIndex(null);

      window.speechSynthesis.speak(utterance);
    }
  };

  return (
    <div className="flex flex-col h-screen max-w-md mx-auto bg-slate-900 text-slate-100 font-sans shadow-2xl relative overflow-hidden">
      
      {}
      <header className="px-4 py-3 bg-slate-800/80 backdrop-blur border-b border-slate-700/60 flex items-center justify-between shrink-0 z-10">
        <div className="flex items-center space-x-2">
          <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
            L
          </div>
          <div>
            <h1 className="font-bold text-base leading-none text-white flex items-center gap-1">
              Learna AI <span className="text-[10px] bg-indigo-500/30 text-indigo-300 border border-indigo-500/30 px-1.5 py-0.5 rounded-full font-normal">Giao Tiếp</span>
            </h1>
            <p className="text-[11px] text-slate-400 mt-0.5">Gia Sư Tiếng Anh AI</p>
          </div>
        </div>

        {/* Gamification Bar */}
        <div className="flex items-center space-x-3">
          <div className="flex items-center text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2 py-1 rounded-full text-xs font-semibold">
            <Flame className="w-3.5 h-3.5 mr-1 fill-amber-400" />
            {streak} ngày
          </div>
          <div className="flex items-center text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2 py-1 rounded-full text-xs font-semibold">
            <Trophy className="w-3.5 h-3.5 mr-1" />
            {xp} XP
          </div>
          <button
            onClick={() => setShowSettings(true)}
            className="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-700/50 transition-colors"
          >
            <Settings className="w-5 h-5" />
          </button>
        </div>
      </header>

      {}
      <main className="flex-1 overflow-y-auto relative flex flex-col">
        
        {/* VIEW 1: SCENARIOS / ROLEPLAY (Tình Huống Hướng Dẫn) */}
        {activeTab === 'scenarios' && (
          <div className="p-4 space-y-4 pb-20">
            <div className="bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl p-4 text-white shadow-lg relative overflow-hidden">
              <div className="relative z-10">
                <span className="text-xs bg-white/20 px-2.5 py-0.5 rounded-full font-medium backdrop-blur">
                  Luyện Nói Tiếng Anh Hàng Ngày
                </span>
                <h2 className="text-lg font-bold mt-2">Chọn Chủ Đề Giao Tiếp</h2>
                <p className="text-xs text-indigo-100 mt-1">
                  Nhấp vào chủ đề bất kỳ để bắt đầu trò chuyện thực tế cùng gia sư AI Learna!
                </p>
              </div>
              <Sparkles className="absolute right-2 bottom-2 w-24 h-24 text-white/10" />
            </div>

            <div className="space-y-3">
              <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">
                Kịch Bản Nhập Vai (Roleplay)
              </h3>

              {SCENARIOS.map((sc) => {
                const isSelected = selectedScenario.id === sc.id;
                return (
                  <div
                    key={sc.id}
                    onClick={() => {
                      setSelectedScenario(sc);
                      setActiveTab('chat');
                    }}
                    className={`p-3.5 rounded-xl border transition-all cursor-pointer flex items-center justify-between ${
                      isSelected
                        ? 'bg-slate-800 border-indigo-500 ring-1 ring-indigo-500 shadow-md'
                        : 'bg-slate-800/50 border-slate-700/60 hover:bg-slate-800 hover:border-slate-600'
                    }`}
                  >
                    <div className="flex items-center space-x-3">
                      <div className="text-2xl bg-slate-700/50 w-11 h-11 rounded-xl flex items-center justify-center shrink-0">
                        {sc.icon}
                      </div>
                      <div>
                        <div className="flex items-center gap-2">
                          <h4 className="font-semibold text-sm text-white">{sc.title}</h4>
                          <span className="text-[10px] bg-slate-700 text-slate-300 px-1.5 py-0.2 rounded">
                            {sc.level}
                          </span>
                        </div>
                        <p className="text-xs text-slate-400 mt-0.5 line-clamp-1">{sc.description}</p>
                      </div>
                    </div>
                    <ChevronRight className="w-5 h-5 text-slate-500 shrink-0" />
                  </div>
                );
              })}
            </div>

            {/* Quick Practice Tips */}
            <div className="p-3.5 rounded-xl bg-slate-800/40 border border-slate-700/40">
              <div className="flex items-center space-x-2 text-indigo-400 font-medium text-xs mb-1">
                <Lightbulb className="w-4 h-4" />
                <span>Mẹo học nói cùng Learna AI:</span>
              </div>
              <p className="text-xs text-slate-300 leading-relaxed">
                Đừng ngại nói sai! Hệ thống sẽ kiểm tra ngữ pháp và sửa lỗi từ vựng trực tiếp bằng Tiếng Việt sau mỗi lượt bạn phát biểu.
              </p>
            </div>
          </div>
        )}

        {/* VIEW 2: CHAT INTERACTION (Màn Hình Hội Thoại) */}
        {activeTab === 'chat' && (
          <div className="flex-1 flex flex-col h-full bg-slate-900">
            
            {/* Scenario Sub-Header */}
            <div className="px-4 py-2.5 bg-slate-800/60 border-b border-slate-700/50 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <span className="text-xl">{selectedScenario.icon}</span>
                <div>
                  <h3 className="font-bold text-xs text-white">{selectedScenario.title}</h3>
                  <p className="text-[10px] text-indigo-400">Gia sư AI đang sẵn sàng lắng nghe</p>
                </div>
              </div>
              <button
                onClick={() => setActiveTab('scenarios')}
                className="text-xs text-slate-400 hover:text-white bg-slate-700/40 px-2.5 py-1 rounded-lg border border-slate-600/40"
              >
                Đổi Chủ Đề
              </button>
            </div>

            {/* Conversation Log */}
            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {messages.map((msg, index) => (
                <div
                  key={index}
                  className={`flex flex-col ${
                    msg.sender === 'user' ? 'items-end' : 'items-start'
                  }`}
                >
                  <div
                    className={`max-w-[85%] rounded-2xl px-4 py-3 text-sm shadow-sm ${
                      msg.sender === 'user'
                        ? 'bg-indigo-600 text-white rounded-br-none'
                        : 'bg-slate-800 border border-slate-700/80 text-slate-100 rounded-bl-none'
                    }`}
                  >
                    <div className="flex items-start justify-between gap-2">
                      <p className="font-medium text-[14px] leading-relaxed">{msg.text}</p>
                      {msg.sender === 'ai' && (
                        <button
                          onClick={() => speakText(msg.text, index)}
                          className={`p-1 rounded hover:bg-slate-700/50 transition-colors shrink-0 ${
                            playingAudioIndex === index ? 'text-indigo-400 animate-pulse' : 'text-slate-400'
                          }`}
                          title="Nghe phát âm chuẩn"
                        >
                          <Volume2 className="w-4 h-4" />
                        </button>
                      )}
                    </div>

                    {/* Vietnamese Translation Guide */}
                    {msg.translation && (
                      <div className="mt-2 pt-2 border-t border-slate-700/50 text-xs text-slate-300 flex items-start gap-1.5">
                        <Globe className="w-3.5 h-3.5 text-indigo-400 shrink-0 mt-0.5" />
                        <span className="italic">{msg.translation}</span>
                      </div>
                    )}
                  </div>
                  <span className="text-[10px] text-slate-500 mt-1 px-1">{msg.time}</span>
                </div>
              ))}

              {isLoading && (
                <div className="flex items-center space-x-2 text-slate-400 bg-slate-800/50 p-3 rounded-2xl w-fit border border-slate-700/40">
                  <RefreshCw className="w-4 h-4 animate-spin text-indigo-400" />
                  <span className="text-xs">Learna AI đang phân tích & trả lời...</span>
                </div>
              )}

              {/* REALTIME FEEDBACK CARD IN VIETNAMESE */}
              {currentFeedback && !isLoading && (
                <div className="bg-slate-800/90 border border-indigo-500/30 rounded-2xl p-3.5 my-2 shadow-lg space-y-2">
                  <div className="flex items-center space-x-1.5 text-amber-400 font-bold text-xs border-b border-slate-700 pb-1.5">
                    <Sparkles className="w-4 h-4" />
                    <span>Hướng Dẫn & Nhận Xét Của Gia Sư (Learna Feedback)</span>
                  </div>

                  <div className="space-y-1.5 text-xs">
                    <div className="flex items-start gap-1.5 text-slate-200">
                      <CheckCircle2 className="w-3.5 h-3.5 text-emerald-400 shrink-0 mt-0.5" />
                      <div>
                        <strong className="text-emerald-400 font-semibold">Ngữ pháp: </strong>
                        {currentFeedback.grammarCheck}
                      </div>
                    </div>

                    <div className="flex items-start gap-1.5 text-slate-200">
                      <Headphones className="w-3.5 h-3.5 text-indigo-400 shrink-0 mt-0.5" />
                      <div>
                        <strong className="text-indigo-300 font-semibold">Mẹo Phát Âm: </strong>
                        {currentFeedback.pronunciationTip}
                      </div>
                    </div>

                    {currentFeedback.suggestedBetterWay && (
                      <div className="bg-slate-900/60 p-2 rounded-lg border border-slate-700/60 mt-1">
                        <span className="text-[10px] text-slate-400 block mb-0.5">💡 Diễn đạt tự nhiên hơn:</span>
                        <p className="text-indigo-300 font-medium italic">{currentFeedback.suggestedBetterWay}</p>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>

            {/* Quick Suggestion Chips */}
            <div className="px-3 py-2 bg-slate-800/40 border-t border-slate-800 flex items-center gap-1.5 overflow-x-auto no-scrollbar">
              <span className="text-[10px] text-slate-400 font-medium shrink-0">Gợi ý nói:</span>
              {SUGGESTED_PHRASES.map((phrase, idx) => (
                <button
                  key={idx}
                  onClick={() => handleSendMessage(phrase)}
                  className="text-xs bg-slate-800 hover:bg-slate-700 text-indigo-200 border border-slate-700/70 rounded-full px-2.5 py-1 whitespace-nowrap transition-colors shrink-0"
                >
                  "{phrase}"
                </button>
              ))}
            </div>

            {/* Input & Microphone Control Bar */}
            <div className="p-3 bg-slate-800 border-t border-slate-700/60 flex items-center space-x-2">
              <button
                onClick={toggleRecording}
                className={`p-3 rounded-full transition-all shrink-0 ${
                  isRecording
                    ? 'bg-rose-500 text-white animate-pulse ring-4 ring-rose-500/30'
                    : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/30'
                }`}
                title={isRecording ? 'Thả để dừng thu âm' : 'Nhấp để nói bằng Giọng Nói'}
              >
                {isRecording ? <MicOff className="w-5 h-5" /> : <Mic className="w-5 h-5" />}
              </button>

              <input
                type="text"
                value={inputText}
                onChange={(e) => setInputText(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                placeholder={isRecording ? 'Đang lắng nghe giọng nói...' : 'Nhập tin nhắn tiếng Anh...'}
                className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 placeholder-slate-500"
              />

              <button
                onClick={() => handleSendMessage()}
                disabled={!inputText.trim() || isLoading}
                className="p-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white rounded-xl transition-colors shrink-0"
              >
                <Send className="w-4 h-4" />
              </button>
            </div>
          </div>
        )}

        {/* VIEW 3: PRACTICE DRILLS & PRONUNCIATION */}
        {activeTab === 'practice' && (
          <div className="p-4 space-y-4 pb-20">
            <h2 className="text-base font-bold text-white">Luyện Tập Chuyên Sâu</h2>

            <div className="grid grid-cols-2 gap-3">
              <div className="bg-slate-800 p-4 rounded-xl border border-slate-700/60 space-y-2">
                <div className="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold">
                  <Headphones className="w-4 h-4" />
                </div>
                <h3 className="text-sm font-semibold text-white">Luyện Nghe Nói</h3>
                <p className="text-xs text-slate-400">Nghe từng câu mẫu ngữ điệu bản xứ và phát âm lại.</p>
                <button 
                  onClick={() => setActiveTab('chat')} 
                  className="text-xs text-indigo-400 font-semibold flex items-center gap-1 mt-2"
                >
                  Bắt đầu <ArrowRight className="w-3 h-3" />
                </button>
              </div>

              <div className="bg-slate-800 p-4 rounded-xl border border-slate-700/60 space-y-2">
                <div className="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold">
                  <BookOpen className="w-4 h-4" />
                </div>
                <h3 className="text-sm font-semibold text-white">Từ Vựng Tình Huống</h3>
                <p className="text-xs text-slate-400">Học từ vựng theo chủ đề kết hợp ví dụ ngữ cảnh.</p>
                <button 
                  onClick={() => setActiveTab('chat')} 
                  className="text-xs text-emerald-400 font-semibold flex items-center gap-1 mt-2"
                >
                  Bắt đầu <ArrowRight className="w-3 h-3" />
                </button>
              </div>
            </div>

            {/* Daily Challenge Card */}
            <div className="bg-slate-800/80 border border-indigo-500/30 rounded-2xl p-4 space-y-3">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2.5 py-0.5 rounded-full">
                  Thử Thách Hôm Nay
                </span>
                <span className="text-xs text-slate-400">+50 XP</span>
              </div>
              <h3 className="text-sm font-bold text-white">Nói 3 câu gọi món bằng Tiếng Anh</h3>
              <p className="text-xs text-slate-300">
                Thực hành tình huống "Gọi Cà Phê" và đạt điểm ngữ pháp trên 80% từ AI Learna.
              </p>
              <button
                onClick={() => {
                  setSelectedScenario(SCENARIOS[0]);
                  setActiveTab('chat');
                }}
                className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition-colors"
              >
                Nhận Thử Thách Ngay
              </button>
            </div>
          </div>
        )}

        {/* VIEW 4: PROGRESS & STATS */}
        {activeTab === 'stats' && (
          <div className="p-4 space-y-4 pb-20">
            <h2 className="text-base font-bold text-white">Thống Kê Tiến Độ Học</h2>

            {/* Overview Metric Cards */}
            <div className="grid grid-cols-3 gap-2">
              <div className="bg-slate-800 p-3 rounded-xl border border-slate-700/60 text-center">
                <Flame className="w-5 h-5 text-amber-400 mx-auto mb-1" />
                <span className="text-lg font-bold text-white">{streak}</span>
                <p className="text-[10px] text-slate-400">Chuỗi ngày</p>
              </div>

              <div className="bg-slate-800 p-3 rounded-xl border border-slate-700/60 text-center">
                <Trophy className="w-5 h-5 text-indigo-400 mx-auto mb-1" />
                <span className="text-lg font-bold text-white">{xp}</span>
                <p className="text-[10px] text-slate-400">Tổng XP</p>
              </div>

              <div className="bg-slate-800 p-3 rounded-xl border border-slate-700/60 text-center">
                <CheckCircle2 className="w-5 h-5 text-emerald-400 mx-auto mb-1" />
                <span className="text-lg font-bold text-white">{accuracyScore}%</span>
                <p className="text-[10px] text-slate-400">Độ chuẩn xác</p>
              </div>
            </div>

            {/* Learning Path */}
            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700/60 space-y-3">
              <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider">Lộ Trình Bản Thân</h3>
              
              <div className="space-y-2">
                <div className="flex items-center justify-between text-xs">
                  <span className="text-slate-300">Cấp độ hiện tại: Sơ Cấp (A2)</span>
                  <span className="text-indigo-400 font-semibold">65%</span>
                </div>
                <div className="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                  <div className="bg-indigo-500 h-full w-[65%]" />
                </div>
              </div>

              <div className="pt-2 border-t border-slate-700/60 space-y-2 text-xs">
                <div className="flex items-center gap-2 text-slate-300">
                  <Check className="w-4 h-4 text-emerald-400" />
                  <span>Đã hoàn thành 12 hội thoại thực tế</span>
                </div>
                <div className="flex items-center gap-2 text-slate-300">
                  <Check className="w-4 h-4 text-emerald-400" />
                  <span>Thuộc 140 từ vựng cốt lõi giao tiếp</span>
                </div>
              </div>
            </div>
          </div>
        )}

      </main>

      {}
      <nav className="bg-slate-800 border-t border-slate-700/80 px-4 py-2 flex items-center justify-around shrink-0 z-10">
        <button
          onClick={() => setActiveTab('scenarios')}
          className={`flex flex-col items-center space-y-1 ${
            activeTab === 'scenarios' ? 'text-indigo-400' : 'text-slate-400 hover:text-slate-200'
          }`}
        >
          <Compass className="w-5 h-5" />
          <span className="text-[10px] font-medium">Chủ Đề</span>
        </button>

        <button
          onClick={() => setActiveTab('chat')}
          className={`flex flex-col items-center space-y-1 ${
            activeTab === 'chat' ? 'text-indigo-400' : 'text-slate-400 hover:text-slate-200'
          }`}
        >
          <MessageSquare className="w-5 h-5" />
          <span className="text-[10px] font-medium">Luyện Nói</span>
        </button>

        <button
          onClick={() => setActiveTab('practice')}
          className={`flex flex-col items-center space-y-1 ${
            activeTab === 'practice' ? 'text-indigo-400' : 'text-slate-400 hover:text-slate-200'
          }`}
        >
          <BookOpen className="w-5 h-5" />
          <span className="text-[10px] font-medium">Thử Thách</span>
        </button>

        <button
          onClick={() => setActiveTab('stats')}
          className={`flex flex-col items-center space-y-1 ${
            activeTab === 'stats' ? 'text-indigo-400' : 'text-slate-400 hover:text-slate-200'
          }`}
        >
          <BarChart2 className="w-5 h-5" />
          <span className="text-[10px] font-medium">Tiến Độ</span>
        </button>
      </nav>

      {}
      {showSettings && (
        <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-xs p-5 space-y-4 shadow-2xl">
            <div className="flex items-center justify-between border-b border-slate-800 pb-2">
              <h3 className="font-bold text-sm text-white flex items-center gap-1.5">
                <Settings className="w-4 h-4 text-indigo-400" />
                Cài Đặt AI Learna
              </h3>
              <button
                onClick={() => setShowSettings(false)}
                className="text-slate-400 hover:text-white text-xs font-bold p-1"
              >
                ✕
              </button>
            </div>

            <div className="space-y-2">
              <label className="text-xs font-semibold text-slate-300 block">
                Gemini API Key (Google AI)
              </label>
              <input
                type="password"
                value={apiKey}
                onChange={(e) => setApiKey(e.target.value)}
                placeholder="Dán mã API Key tại đây..."
                className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
              />
              <p className="text-[10px] text-slate-400 leading-tight">
                Nhập API key của riêng bạn để mở khóa toàn bộ tính năng phản hồi và sửa lỗi ngữ pháp nâng cao từ Google Gemini API.
              </p>
            </div>

            <div className="pt-2">
              <button
                onClick={() => saveApiKey(apiKey)}
                className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition-colors"
              >
                Lưu Thay Đổi
              </button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}
  </script>
</body>
</html>
